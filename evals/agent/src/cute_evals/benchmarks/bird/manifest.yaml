          type: string
          description: The final single SQLite SELECT or WITH statement, with exactly the requested output columns.
      required:
        - sql
      additionalProperties: false
answerContract:
  version: bird-final-sql-v1
  instruction: |
    BIRD submission contract: use the provided read-only tools to inspect the
    database. When the analysis is complete, call `submit_sql` exactly once
    with the final single SQLite SELECT or WITH statement. That statement must
    return exactly the rows and columns requested by the question. Do not leave
    the final SQL only in prose. After `submit_sql` succeeds, answer concisely.
