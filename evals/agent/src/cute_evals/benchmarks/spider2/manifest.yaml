tools:
  - name: list_tables
    description: List the tables and views in the current read-only Spider2-Lite database.
    parameters:
      type: object
      properties: {}
      additionalProperties: false
  - name: describe_table
    description: Return column names, declared types, nullability, and keys for one table or view.
    parameters:
      type: object
      properties:
        table_name:
          type: string
          description: Exact table or view name from list_tables.
      required:
        - table_name
      additionalProperties: false
  - name: sql_query
    description: Execute one read-only SELECT or WITH query and return bounded rows plus a truncation flag.
    parameters:
      type: object
      properties:
        sql:
          type: string
          description: A single SQLite SELECT or WITH statement.
      required:
        - sql
      additionalProperties: false
  - name: submit_sql
    description: Submit the final single read-only SQLite query for official Spider2-Lite evaluation.
    parameters:
      type: object
      properties:
        sql:
          type: string
          description: The final single SQLite SELECT or WITH statement, with exactly the requested output columns.
      required:
        - sql
      additionalProperties: false
answerContract:
  version: spider2-final-sql-v1
  instruction: |
    Spider2-Lite submission contract: use the provided read-only tools to
    inspect the database. When the analysis is complete, call `submit_sql`
    exactly once with the final single SQLite SELECT or WITH statement. That
    statement must return exactly the rows and columns requested by the
    question. Do not leave the final SQL only in prose. After `submit_sql`
    succeeds, answer concisely.
budgets:
  maxWallMs: 300000
  maxTokens: 60000
  maxSteps: 16
  maxToolCalls: 20
  queryTimeoutSeconds: 30
  maxResultRows: 200
