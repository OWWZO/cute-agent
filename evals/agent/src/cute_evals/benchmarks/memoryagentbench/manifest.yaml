chunking:
  model: gpt-4o-mini
  size: 4096
seedTimestamp:
  start: "2024-01-01 00:00:00"
  stepSeconds: 1
answerContract:
  version: memoryagentbench-final-answer-v1
  linePrefix: "FINAL_ANSWER:"
  instruction: |-
    Answer from the context already stored in the user's memory. When the task
    says "Search Archival Memory", use the available session_search tool.
    Only when the task explicitly asks to assign a numerical label from the
    provided mapping, put that numeric label in the final answer (for example,
    `FINAL_ANSWER: 18`), not `label: 18`. Multiple-choice questions must return
    the complete selected option text, not an option number.
    Return only the requested value and finish with exactly one line of the form
    `FINAL_ANSWER: <answer>`. Do not include explanations or a second answer line.
answerContractByScorer:
  text: concise
  ruler_recall: concise
  longmemeval_judge: concise
  summary_judge:
    version: memoryagentbench-summary-answer-v1
    linePrefix: "FINAL_ANSWER:"
    multiline: true
    instruction: |-
      Answer from the context already stored in the user's memory. After all
      reasoning, write `FINAL_ANSWER:` followed by the complete requested book
      summary. The summary may span multiple lines. Do not include a second
      `FINAL_ANSWER:` marker.
  recsys_recall:
    version: memoryagentbench-recsys-answer-v1
    linePrefix: "FINAL_ANSWER:"
    multiline: true
    instruction: |-
      Answer from the context already stored in the user's memory. After all
      reasoning, write `FINAL_ANSWER:` followed by exactly 20 numbered movie
      recommendations, one per line. Do not include extra commentary or a second
      `FINAL_ANSWER:` marker.
budgets:
  maxWallMs: 300000
  maxTokens: 120000
  maxSteps: 10
  maxToolCalls: 12
