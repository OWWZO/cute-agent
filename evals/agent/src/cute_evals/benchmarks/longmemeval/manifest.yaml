  linePrefix: "FINAL_ANSWER:"
  instruction: |-
    Use the user's stored conversation history when it is relevant. Do not invent
    facts that are absent from the history. After all reasoning, finish with exactly
    one line of the form `FINAL_ANSWER: <answer>`. Keep the value concise.
    If the question names a job title, use only the exact title as evidence. A
    similar or shorter title is a different role, not an alias. If the exact title
    is absent, answer only `FINAL_ANSWER: Unavailable`; do not include any number,
    explanation, or fact from the similar role.
