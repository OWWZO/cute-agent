id: production.no-artifact-control
suite: production-core
version: 1
hardGate: true
metadata:
  role: validation
  source: curated-production-like
  taskType: control
  lengthBucket: short
  toolCountBucket: none
  risk: low
  failureMode: unnecessary_artifact
judgeTask: "只做简单算术，不调用工具，也不生成文件或图表。"
input:
  message: "只计算 18 + 24 等于多少，不要生成文件或图表。"
expected:
  finalContains: ["42"]
  finalNotContains: ["已生成", "图表文件"]
  maxSteps: 1
  requiredTools: []
  requiredToolSequence: []
  strictToolSequence: true
  referenceToolSequence: []
  subgoals:
    - id: calculate_directly
      finalContains: ["42"]
  forbiddenTools: ["read_file", "sql_query", "search_web"]
  minArtifacts: 0
budgets:
  maxTotalTokens: 300
  maxWallMs: 30000
script:
  - type: final
    content: "18 + 24 = 42。"
    promptTokens: 60
    completionTokens: 12
    totalTokens: 72
