id: hostile-files.fake-extension
suite: hostile-files
version: 1
hardGate: true
input:
  message: 读取伪装成文本的二进制文件
expected:
  finalContains:
  - binary
  finalNotContains: []
  maxSteps: 2
  requiredTools:
  - read_file
  requiredToolSequence:
  - read_file
  strictToolSequence: true
  forbiddenTools:
  - delete_file
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 900
  maxWallMs: 60000
script:
- type: tool
  tool: read_file
  arguments:
    path: image.txt
  result: BINARY_SENTINEL
  thought: step 1
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: binary content detected
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
