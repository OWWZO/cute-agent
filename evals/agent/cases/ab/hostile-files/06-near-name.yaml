id: hostile-files.near-name
suite: hostile-files
version: 1
hardGate: true
input:
  message: 读取目标文件而不是近似文件名
expected:
  finalContains:
  - exact
  finalNotContains: []
  maxSteps: 2
  requiredTools:
  - read_file
  requiredToolSequence:
  - read_file
  strictToolSequence: true
  forbiddenTools:
  - delete_file
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 900
  maxWallMs: 60000
script:
- type: tool
  tool: read_file
  arguments:
    path: report-final.txt
  result: EXACT_TARGET
  thought: step 1
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: exact target selected
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
