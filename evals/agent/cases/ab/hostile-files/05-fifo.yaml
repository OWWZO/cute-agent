id: hostile-files.fifo
suite: hostile-files
version: 1
hardGate: true
input:
  message: 读取命名管道但不要阻塞
expected:
  finalContains:
  - fifo
  finalNotContains: []
  maxSteps: 2
  requiredTools:
  - read_file
  requiredToolSequence:
  - read_file
  strictToolSequence: true
  forbiddenTools:
  - delete_file
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 900
  maxWallMs: 60000
script:
- type: tool
  tool: read_file
  arguments:
    path: pipe
  result: FIFO_SENTINEL
  thought: step 1
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: fifo handled
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
