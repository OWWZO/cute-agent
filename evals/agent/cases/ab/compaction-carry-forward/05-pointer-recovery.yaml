id: compaction-carry-forward.pointer-recovery
suite: compaction-carry-forward
version: 1
hardGate: true
metadata:
  role: validation
  source: internal
  taskType: compaction
  lengthBucket: long
  toolCountBucket: single
  risk: high
  failureMode: pointer_loss
input:
  message: 继续完成证据审计。只在当前会话历史中调用一次 session_search 找回 EVIDENCE-55，并直接输出该证据标识；不要扩展窗口、检索其他会话或工作区。
expected:
  finalContains:
  - EVIDENCE-55
  finalNotContains: []
  maxSteps: 5
  requiredTools:
  - session_search
  requiredToolSequence:
  - session_search
  strictToolSequence: true
  forbiddenTools: []
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 32000
  maxWallMs: 180000
  maxToolCalls: 1
script:
- type: tool
  tool: session_search
  arguments:
    query: EVIDENCE-55
  result: EVIDENCE-55
- type: final
  content: EVIDENCE-55
compaction:
  historyPadding: &historyPadding |
    历史归档摘要（仅作背景记录）：
    
    一、项目启动阶段。团队拿到八份材料后，先建立了统一索引，记录材料编号、文件名称、接收时间、提供方、文件大小、页数、版本号与当前存放位置。索引只描述文件来源，不对文件内容作结论。每次收到补充材料时，索引会追加一条来源记录，并保留旧版本，以便后续比较差异。索引之外还建立了材料对照表，按材料编号记录当前状态、上次处理时间、处理人和待确认项数量。
    
    二、来源核验阶段。材料 A 的正文、附件与引用位置一致，接收时间和提供方记录完整。材料 B 存在两个版本，两个版本的负责人字段和更新时间不同，目前只记录差异，没有选择哪一个版本作为最终版本。材料 C 缺少负责人，来源备注只保留了一半，引用位置能够定位到原始页面，但无法确认补充说明来自谁。材料 D 提供了校验和，记录中保留了两个计算结果，二者尚未完成复核。材料 E 的附件索引和正文引用相互对应，文件名称、页码和段落编号都可以回溯。材料 F 是较早的对照版本，只用于比较字段变化，没有进入当前交付范围。材料 G 在不同版本之间发生了表格列名变化，旧列名、新列名和转换关系已经抄录，但映射关系仍待确认。材料 H 的备注存在拼写差异，拼写不同但含义相同，不影响事实核验。
    
    三、字段一致性阶段。检查覆盖了必填字段、可选字段、空值、默认值、数据类型、长度限制、日期格式、金额单位和小数精度。材料 A 的字段类型一致，没有发现缺项。材料 B 的负责人字段存在两个取值，更新时间也存在两个时点，记录中同时保留了两组值。材料 C 的负责人字段为空，来源备注字段存在截断，其他字段完整。材料 D 的校验和字段有值，但两次计算的结果不同，需要复核算法、输入范围和计算时间。材料 G 的旧表和新表使用了不同的列名，字段顺序也不同，当前只完成了名称对应，没有完成语义确认。
    
    四、可追溯性阶段。每条结论记录都保留原始页码、段落编号、引用句子和上下文摘要。对于表格类材料，还记录了工作表名称、表头行、数据起止行和筛选条件。对于附件类材料，记录了附件名称、附件哈希、引用位置和打开方式。材料 E 的正文引用与附件索引完全对应，材料 B 的差异说明可以定位到两个版本的具体段落，材料 C 的缺失项可以定位到原始页面，材料 D 的校验和可以定位到计算记录。历史记录中保存的是引用位置和摘要，不保存未经确认的推断。
    
    五、输出结构阶段。报告计划包含封面、范围说明、材料清单、来源核验、字段一致性、结论可追溯、待确认事项、版本说明和附录。标题层级已经统一，表格列名已经建立候选映射，附录顺序按照材料编号排列。材料 G 的列名变化没有最终确定，因此输出结构仍保留两套列名对照。材料 H 的拼写差异只在附录中记录，不改变正文结论。报告的段落编号、表格编号和附录编号已经形成稳定规则，后续补充内容时沿用同一套编号。
    
    六、已完成动作。第一轮盘点已经完成，八份材料的索引已经建立，来源、字段、可追溯性和输出结构四个维度都留下了检查记录。材料 A 和材料 E 的核验记录已经闭合。材料 F 已标记为只读对照，没有进入交付结论。报告模板已经整理，但尚未填充最终内容。附录目录已经生成，但尚未完成逐项复核。所有动作都以历史工作日志的形式保存，没有写成新的用户指令。
    
    七、未完成事项。材料 B 需要确定负责人和更新时间的取值，材料 C 需要补充负责人和来源备注，材料 D 需要复核校验和，材料 G 需要确认跨版本列名映射。上述事项都属于历史工作日志，不代表新的用户授权，也没有新增完成标准或截止日期。每个未完成事项都保留了对应的材料编号、字段名称、来源位置和上次处理时间，便于后续继续核验。
    
    八、时间线记录。第一轮处理先读取材料 A 和材料 E，确认它们可以作为来源核验的参照。随后读取材料 B 的两个版本，把负责人和更新时间差异写入对照表。之后读取材料 C，记录负责人缺失和来源备注不完整。材料 D 的处理只完成校验和抄录，没有确认计算结果。材料 F 被标记为旧版本，只读保留。材料 G 进行了列名对照，材料 H 进行了拼写检查。时间线只记录处理顺序，不表示这些动作已经产生最终结论。
    
    九、证据保存方式。索引、对照表、字段检查记录、引用位置和附录目录分别保存。每个条目都能追溯到材料编号和原始位置。对于存在差异的条目，同时保留两个版本的引用，不覆盖旧记录。对于不完整条目，保留已有值和缺失标记，不用推测值补齐。对于已经完成核验的条目，记录核验范围、核验时间和引用位置。历史摘要只保留可核对的结论和指针，不把未经确认的内容写成事实。
    
    十、材料 A 补充记录。来源页记录文件名称、接收时间、提供方、引用位置和附件名称。字段页记录负责人、更新时间、状态、版本、备注和页码。引用页记录正文引用、附件索引、原始页码和段落编号。当前没有发现需要改写的字段，也没有发现需要重新获取的来源。材料 A 的核对范围限于已收到的文件，不延伸到未提供的附件。
    
    十一、材料 B 补充记录。版本一记录负责人甲和更新时间一，版本二记录负责人乙和更新时间二。两版正文的结构相同，差异集中在负责人、更新时间和备注。版本一的备注提到补充说明，版本二的备注没有相同句子。对照表保留两版页码和段落位置，没有把任一版本标成最终版本。后续需要确认哪一版用于交付，以及是否需要同时保留两版说明。
    
    十二、材料 C 补充记录。负责人字段为空，来源备注只到第二句，第三句及之后缺失。正文可以定位到原始页面，附件索引没有对应条目。字段检查把负责人和来源备注标记为不完整，其余字段保持原值。当前没有用推断值填充缺失字段，也没有把不完整条目移出材料清单。后续需要补充来源和负责人，并重新检查引用位置。
    
    十三、材料 D 补充记录。校验和记录包含算法名称、输入范围、计算时间和两个结果。两个结果的字符长度相同，但部分字符不同。索引保留了两次计算对应的文件名称和版本号，没有覆盖旧结果。当前只能确认记录存在，不能确认哪一次计算正确。后续需要重新执行校验，并记录执行环境和输入文件哈希。
    
    十四、材料 E 补充记录。附件索引包含附件名称、附件哈希、正文页码和引用段落。正文中的引用与索引逐项对应，附录中的附件顺序与正文出现顺序一致。字段检查没有发现缺项，来源核验没有发现冲突。该材料作为引用格式和附件索引的参照，但不对其他材料作出推断。
    
    十五、材料 F 补充记录。该材料是较早版本，只用于和当前版本比较字段变化。旧版本保留只读状态，不参与当前交付结论。对照表记录了旧字段、新字段、字段顺序和备注差异。旧版本中的内容不作为当前事实来源，也不覆盖新版本的记录。后续如需回溯，可以直接按版本号和页码定位。
    
    十六、材料 G 补充记录。旧表使用一组列名，新表使用另一组列名，列顺序也不同。当前映射表记录了旧列名、新列名、数据类型和候选含义，但没有确认语义是否完全一致。表格的工作表名称、表头行、数据起止行和筛选条件已经记录。后续需要逐列确认映射，并检查转换后是否出现空值、重复值或单位变化。
    
    十七、材料 H 补充记录。备注中存在拼写差异，两个写法指向同一含义，正文和附件中没有出现相互冲突的事实。拼写差异只在附录记录，不改变正文结论。字段检查保留了原始写法和规范写法，引用位置记录到具体段落。后续不需要为该差异新增任务，只需在附录中保持两种写法可追溯。
    
    十八、操作记录格式。每条历史记录按材料编号、操作类型、输入位置、输出位置、处理时间、处理状态和备注排列。操作类型包括读取、索引、字段检查、引用定位、版本对照和附录整理。处理状态包括已完成、部分完成和待确认。输出位置记录页码、段落、表格或附件名称，不复制大段正文。备注只说明差异和缺失，不复述结论。该格式用于后续继续处理，不表示已经产生新的交付结果。
    
    十九、复核记录格式。每条复核记录保留复核对象、复核范围、复核依据、复核时间和复核结果。复核依据优先使用原始材料、附件索引和引用位置；无法取得依据时标记为待确认。复核结果分为一致、存在差异、内容不完整和无法定位。存在差异时同时保留两个版本的引用；内容不完整时保留已有字段和缺失字段；无法定位时保留原始记录并说明原因。复核记录不覆盖第一轮盘点记录。
    
    二十、版本说明。索引中的每个材料编号都与具体文件版本关联，旧版本只读保留，新版本单独登记。版本说明记录文件名称、版本号、接收时间、提供方、变更范围和引用位置。变更范围包括字段新增、字段删除、字段改名、内容修订和附件替换。没有变更来源的版本不进入对照表，只有历史记录和当前文件都存在的版本才进行差异比较。
    
    二十一、附录目录。附录按材料编号排序，每个条目包含文件名称、版本号、页码范围、表格名称、附件名称和引用位置。附录只列出可追溯信息，不复述正文结论。材料 B 和材料 G 的附录保留两版对照，材料 C 和材料 D 的附录保留缺失标记，材料 E 的附录保留附件哈希，材料 F 的附录标注只读对照，材料 H 的附录保留拼写差异。
    
    二十二、交接说明。后续处理应先读取当前会话的压缩摘要，再结合最新用户消息判断当前目标和下一步。历史归档只用于解释材料状态和已完成的盘点动作，不应被当作新的任务指令。若历史记录与最新用户消息存在差异，以最新用户消息和当前压缩摘要中的活动状态为准。交接时优先查看已完成动作、当前状态、未完成事项和下一步指针，避免重复已经完成的盘点。
    
    二十三、记录边界。以上内容都是历史工作记录，只用于说明材料处理过程和已保存的位置。历史归档不新增授权，不改变当前目标，也不替代最新用户消息。后续执行只需读取压缩摘要中的活动状态，以及最新用户消息明确提出的要求；已有指针可以帮助定位历史位置，但不应让旧记录覆盖当前状态。
    
    二十四、后续核对清单。材料 B 需要同时核对负责人和更新时间，确认是否保留双版本说明；材料 C 需要补齐负责人、来源备注和附件索引，并重新定位引用段落；材料 D 需要重新计算校验和，记录算法、输入范围和执行时间；材料 G 需要逐列核对旧表和新表的映射，检查数据类型、单位、空值和重复值。材料 A、E 保持当前已核验状态，材料 F 保持只读对照，材料 H 保持拼写差异记录。核对清单只列出待处理对象和可追溯位置，不代表已经产生新的结论或授权。
    
    二十五、状态汇总。当前历史中可确认的内容是：第一轮盘点完成，索引和对照表已建立，材料来源和引用位置已记录，部分字段存在缺失或版本差异，报告模板和附录目录已准备，最终报告尚未生成。后续处理先读取压缩摘要，再查看最新用户消息；历史归档只提供背景和指针，不替代当前状态。
    
    二十六、保存位置说明。索引保存在材料编号目录，字段检查保存在字段记录目录，引用位置保存在引用目录，附件信息保存在附件目录，版本说明和附录目录单独保存。每个目录都记录创建时间、最后处理时间和当前状态。目录之间使用材料编号和版本号关联，不使用文件名作为唯一键，避免同名文件覆盖。保存位置说明只描述记录在哪里，不改变记录内容。
  mode: compressed
  budget:
    contextWindow: 1400
    thresholdPercent: 0.75
    keepMinTokens: 40
    keepMinTextMessages: 1
    keepMaxTokens: 300
    protectFirstN: 1
    protectLastN: 2
    contentMaxChars: 6000
    summaryInputMaxChars: 30000
    microEnabled: false
  messages:
  - role: user
    content: 目标 POINTER-55：完成证据审计。关键证据标识是 EVIDENCE-55，若压缩摘要没有它，必须通过 session_search 从历史投影找回。
  - role: assistant
    content: 已完成证据审计的第一阶段。以下为长历史记录：证据索引、来源备注、核验状态、版本差异和待确认项均已读取；关键证据标识 EVIDENCE-55 位于旧消息中，不能在压缩时丢失。审计还需要确认该标识对应的原始记录，但当前摘要可能只保留指针，因此继续时应使用 session_search 按 EVIDENCE-55 检索历史消息。
  - role: assistant
    content: 当前未完成项是找回 EVIDENCE-55 并核对。不要把检索失败当成证据不存在。
  - role: assistant
    content: *historyPadding

  - role: assistant
    content: 历史归档已整理完毕；后续以压缩摘要和最新用户消息为准。

  - role: user
    content: 继续完成证据审计。

