id: cache-efficiency.two-tool-lookup
suite: cache-efficiency
version: 1
hardGate: true
metadata:
  role: validation
  source: internal
  taskType: cache-prefix
  lengthBucket: medium
  toolCountBucket: few
  risk: medium
  failureMode: prompt_cache_invalidated
input:
  message: Call cache_alpha for key A, then cache_beta for key B. After both calls succeed, answer CACHE-STABLE-OK.
expected:
  finalContains:
  - CACHE-STABLE-OK
  finalNotContains: []
  maxSteps: 6
  requiredTools:
  - cache_alpha
  - cache_beta
  requiredToolSequence: []
  strictToolSequence: false
  forbiddenTools: []
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 30000
  maxWallMs: 180000
  maxToolCalls: 6
script:
- type: final
  content: CACHE-STABLE-OK
tools:
- name: cache_alpha
  description: Read a stable cache probe value for the alpha namespace.
  parameters:
    type: object
    properties:
      key:
        type: string
    required:
    - key
- name: cache_beta
  description: Read a stable cache probe value for the beta namespace.
  parameters:
    type: object
    properties:
      key:
        type: string
    required:
    - key
- name: cache_gamma
  description: Read a stable cache probe value for the gamma namespace.
  parameters:
    type: object
    properties:
      key:
        type: string
    required:
    - key
