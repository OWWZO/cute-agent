id: clarify-multiturn.exact-target
suite: clarify-multiturn
version: 1
hardGate: true
input:
  message: 确认精确目标后继续
expected:
  finalContains:
  - /tmp/report
  finalNotContains: []
  maxSteps: 2
  requiredTools:
  - ask_user
  requiredToolSequence:
  - ask_user
  strictToolSequence: true
  forbiddenTools: []
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 900
  maxWallMs: 60000
script:
- type: tool
  tool: ask_user
  arguments:
    question: 确认目标？
  result: /tmp/report
  thought: step 1
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: target /tmp/report
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
