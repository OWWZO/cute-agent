id: tool-discovery.eager-control
suite: tool-discovery
version: 1
hardGate: true
input:
  message: 读取本地配置
expected:
  finalContains:
  - EAGER_FILE
  finalNotContains: []
  maxSteps: 2
  requiredTools:
  - read_file
  requiredToolSequence:
  - read_file
  strictToolSequence: true
  forbiddenTools: []
  requireToolRecovery: false
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 900
  maxWallMs: 60000
script:
- type: tool
  tool: read_file
  arguments:
    path: local.txt
  result: EAGER_FILE
  thought: step 1
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: EAGER_FILE
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
