  totalTokens: 100
- type: tool
  tool: session_search
  arguments:
    query: H
  result: H-88
  thought: step 2
  promptTokens: 80
  completionTokens: 20
  totalTokens: 100
- type: final
  content: G-77 and H-88
  promptTokens: 60
  completionTokens: 20
  totalTokens: 80
