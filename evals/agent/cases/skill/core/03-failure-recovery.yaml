id: skill.failure-recovery
suite: skill-sim
version: 1
hardGate: true
judgeTask: "首次加载 pdf skill 超时，重试一次后成功并完成任务。"
input:
  message: "读取 scanned.pdf 并提取正文；如果 skill 加载超时，重试一次。"
expected:
  finalContains: ["重试", "完成"]
  maxSteps: 3
  requiredTools: ["skill_view"]
  requiredToolSequence: ["skill_view", "skill_view"]
  strictToolSequence: true
  forbiddenTools: []
  requireToolRecovery: true
  minToolSuccessRate: 0.5
  requiredSkill: "pdf"
  forbiddenSkills: ["xlsx", "docx"]
  maxSkillLoads: 2
budgets:
  maxTotalTokens: 500
  maxWallMs: 60000
script:
  - type: tool
    tool: skill_view
    arguments:
      name: "pdf"
    fault: timeout
    thought: "先尝试加载 pdf skill。"
    promptTokens: 100
    completionTokens: 20
    totalTokens: 120
  - type: tool
    tool: skill_view
    arguments:
      name: "pdf"
    result: "pdf skill：读取扫描 PDF 的正文。"
    thought: "超时后重试加载 pdf skill。"
    promptTokens: 120
    completionTokens: 20
    totalTokens: 140
  - type: final
    content: "PDF skill 加载超时后已重试，正文提取完成。"
    promptTokens: 80
    completionTokens: 24
    totalTokens: 104
