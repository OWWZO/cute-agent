id: rag.no-evidence
suite: rag-core
version: 1
hardGate: true
judgeTask: "知识库没有宠物托运报销制度时，应明确说明无法从知识库确认，不能编造报销结论。"
input:
  message: "员工可以报销宠物托运费用吗？如果知识库没有依据，请明确说明。"
expected:
  finalContains: ["知识库未提供"]
  finalNotContains: ["无法报销"]
  maxSteps: 2
  requiredTools: ["mrag_query"]
  requiredToolSequence: ["mrag_query"]
  strictToolSequence: true
  forbiddenTools: []
  minToolSuccessRate: 1.0
  noEvidence: true
budgets:
  maxTotalTokens: 700
  maxWallMs: 60000
script:
  - type: tool
    tool: mrag_query
    arguments:
      question: "宠物托运费用报销规定"
      kbId: "policy"
    result: "未检索到关于宠物托运报销的制度条款。"
    thought: "先确认知识库是否存在相关规定。"
    promptTokens: 120
    completionTokens: 20
    totalTokens: 140
  - type: final
    content: "知识库未提供宠物托运报销依据，不能据此作出报销结论。"
    promptTokens: 100
    completionTokens: 22
    totalTokens: 122
