id: rag.cited-answer
suite: rag-core
version: 1
hardGate: true
judgeTask: "从企业知识库回答国内差旅住宿报销上限为 1200 元，并给出可定位的 policy.pdf#p3 引用。"
input:
  message: "从企业知识库回答国内差旅住宿报销上限，并给出引用。"
expected:
  finalContains: ["1200", "[policy.pdf#p3]"]
  finalNotContains: ["没有引用"]
  maxSteps: 2
  requiredTools: ["mrag_query"]
  requiredToolSequence: ["mrag_query"]
  strictToolSequence: true
  forbiddenTools: []
  minToolSuccessRate: 1.0
  requiredCitations: ["[policy.pdf#p3]"]
budgets:
  maxTotalTokens: 600
  maxWallMs: 60000
script:
  - type: tool
    tool: mrag_query
    arguments:
      question: "差旅报销上限是多少？"
      kbId: "policy"
    result: "[policy.pdf#p3] 国内差旅住宿报销上限为 1200 元。"
    thought: "先检索企业知识库。"
    promptTokens: 120
    completionTokens: 22
    totalTokens: 142
  - type: final
    content: "国内差旅住宿报销上限为 1200 元。[policy.pdf#p3]"
    promptTokens: 100
    completionTokens: 26
    totalTokens: 126
