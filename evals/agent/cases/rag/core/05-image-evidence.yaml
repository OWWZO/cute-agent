id: rag.image-evidence
suite: rag-core
version: 1
hardGate: true
judgeTask: "根据架构图回答数据库写入路径，并引用 architecture.png 的图片证据。"
input:
  message: "架构图里数据库写入路径经过哪个组件？请回答并给出图片引用。"
expected:
  finalContains: ["write-ahead log", "异步刷入主库", "[architecture.png#img2]"]
  finalNotContains: ["没有图片"]
  maxSteps: 2
  requiredTools: ["mrag_query"]
  requiredToolSequence: ["mrag_query"]
  strictToolSequence: true
  forbiddenTools: []
  minToolSuccessRate: 1.0
  requiredCitations: ["[architecture.png#img2]"]
budgets:
  maxTotalTokens: 800
  maxWallMs: 60000
script:
  - type: tool
    tool: mrag_query
    arguments:
      question: "数据库写入路径经过哪个组件？"
      kbId: "architecture"
    result: "[architecture.png#img2] 写入请求先进入 write-ahead log，然后异步刷入主库。"
    thought: "检索架构图及其说明。"
    promptTokens: 120
    completionTokens: 24
    totalTokens: 144
  - type: final
    content: "数据库写入请求先进入 write-ahead log，然后异步刷入主库。[architecture.png#img2]"
    promptTokens: 100
    completionTokens: 22
    totalTokens: 122
