id: react.rate-limit-recovery
suite: react-core
version: 1
hardGate: true
judgeTask: "调用搜索服务；首次遇到 429 限流后退避重试，重试成功并说明结果。"
input:
  message: "调用搜索服务，遇到限流后退避重试。"
expected:
  finalContains: ["重试", "成功"]
  maxSteps: 3
  requiredTools: ["search_web"]
  requiredToolSequence: ["search_web", "search_web"]
  strictToolSequence: true
  forbiddenTools: []
  requireToolRecovery: true
budgets:
  maxTotalTokens: 700
  maxWallMs: 60000
script:
  - type: tool
    tool: search_web
    arguments:
      query: agent evaluation
    fault: rate_limit
    thought: "先调用搜索。"
    promptTokens: 100
    completionTokens: 20
    totalTokens: 120
  - type: tool
    tool: search_web
    arguments:
      query: agent evaluation
    result: "找到 3 条相关结果。"
    thought: "限流后重试。"
    promptTokens: 120
    completionTokens: 20
    totalTokens: 140
  - type: final
    content: "搜索触发限流，退避重试后成功。"
    promptTokens: 80
    completionTokens: 24
    totalTokens: 104
