id: react.wrong-tool-correction
suite: react-core
version: 1
hardGate: true
judgeTask: "最终说明项目入口文件是 main.java，并且它使用的语言是 Java。"
input:
  message: "找到项目入口文件并说明它使用的语言。"
expected:
  finalContains: ["main.java", "Java"]
  maxSteps: 3
  requiredTools: ["search_web", "read_file"]
  requiredToolSequence: ["search_web", "read_file"]
  strictToolSequence: true
  forbiddenTools: []
  minToolSuccessRate: 1.0
budgets:
  maxTotalTokens: 700
  maxWallMs: 60000
script:
  - type: tool
    tool: search_web
    arguments:
      query: project entry file
    result: "搜索结果与本地项目无关。"
    thought: "先尝试搜索。"
    promptTokens: 100
    completionTokens: 20
    totalTokens: 120
  - type: tool
    tool: read_file
    arguments:
      path: src/main.java
    result: "public class Main { public static void main(String[] args) {} }"
    thought: "搜索结果无效，改为读取本地入口。"
    promptTokens: 120
    completionTokens: 20
    totalTokens: 140
  - type: final
    content: "入口文件是 main.java，代码使用 Java 编写。"
    promptTokens: 80
    completionTokens: 24
    totalTokens: 104
