[project]
name = "cute-evals"
version = "0.1.0"
description = "Execution-ledger evaluation sidecar for Cute-agent"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "numpy>=1.26,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
frameworks = [
    "inspect-ai>=0.3,<1",
    "deepeval>=2,<4",
    "agentevals>=0.0.4,<1",
    "ragas>=0.2,<1",
    # ragas 0.4 imports a module removed in langchain-community 0.4.
    "langchain-community>=0.3.31,<0.4",
]
phase3 = [
    "datasets>=3,<5",
    "huggingface-hub>=0.24,<2",
]
judge = [
    "openai>=1,<4",
    "scikit-learn>=1.5,<2",
    "tqdm>=4.65,<5",
]
service = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]
memoryagentbench = [
    "nltk>=3.8,<4",
    "pyarrow>=15,<27",
    "rapidfuzz>=3.10,<4",
    "tiktoken>=0.7,<1",
]
deepresearch = [
    "requests>=2.31,<3",
    "tqdm>=4.65,<5",
]
rag = [
    "requests>=2.31,<3",
]
phase4 = [
    "func-timeout>=4.3.5,<5",
    "pandas>=2.2,<4",
    "psycopg2-binary>=2.9,<3",
    "pymysql>=1.1,<2",
]

[project.scripts]
cute-evals = "cute_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cute_evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/cute_evals/benchmarks/bird/manifest.yaml" = "cute_evals/benchmarks/bird/manifest.yaml"
"src/cute_evals/benchmarks/compactbench/manifest.yaml" = "cute_evals/benchmarks/compactbench/manifest.yaml"
"src/cute_evals/benchmarks/deepresearch/manifest.yaml" = "cute_evals/benchmarks/deepresearch/manifest.yaml"
"src/cute_evals/benchmarks/gaia/manifest.yaml" = "cute_evals/benchmarks/gaia/manifest.yaml"
"src/cute_evals/benchmarks/gaia/official_scorer.py" = "cute_evals/benchmarks/gaia/official_scorer.py"
"src/cute_evals/benchmarks/longmemeval/manifest.yaml" = "cute_evals/benchmarks/longmemeval/manifest.yaml"
"src/cute_evals/benchmarks/longmemeval/official_prompt.py" = "cute_evals/benchmarks/longmemeval/official_prompt.py"
"src/cute_evals/benchmarks/memoryagentbench/manifest.yaml" = "cute_evals/benchmarks/memoryagentbench/manifest.yaml"
"src/cute_evals/benchmarks/memoryagentbench/official_summarization_prompts.json" = "cute_evals/benchmarks/memoryagentbench/official_summarization_prompts.json"
"src/cute_evals/benchmarks/marble/manifest.yaml" = "cute_evals/benchmarks/marble/manifest.yaml"
"src/cute_evals/benchmarks/rag/manifest.yaml" = "cute_evals/benchmarks/rag/manifest.yaml"
"src/cute_evals/benchmarks/skillsbench/manifest.yaml" = "cute_evals/benchmarks/skillsbench/manifest.yaml"
"src/cute_evals/benchmarks/spider2/manifest.yaml" = "cute_evals/benchmarks/spider2/manifest.yaml"
"src/cute_evals/benchmarks/tau2/manifest.yaml" = "cute_evals/benchmarks/tau2/manifest.yaml"
"src/cute_evals/benchmarks/tau2/server.py" = "cute_evals/benchmarks/tau2/server.py"
"src/cute_evals/judge_benchmarks/agent_process_bench/manifest.yaml" = "cute_evals/judge_benchmarks/agent_process_bench/manifest.yaml"
"src/cute_evals/judge_benchmarks/agent_reward_bench/manifest.yaml" = "cute_evals/judge_benchmarks/agent_reward_bench/manifest.yaml"
"src/cute_evals/judge_benchmarks/trail/manifest.yaml" = "cute_evals/judge_benchmarks/trail/manifest.yaml"
"schemas/experiment.schema.json" = "cute_evals/schemas/experiment.schema.json"
"schemas/cell.schema.json" = "cute_evals/schemas/cell.schema.json"
"schemas/ab-report.schema.json" = "cute_evals/schemas/ab-report.schema.json"
"schemas/case.schema.json" = "cute_evals/schemas/case.schema.json"
"schemas/case-draft.schema.json" = "cute_evals/schemas/case-draft.schema.json"
"schemas/trace.schema.json" = "cute_evals/schemas/trace.schema.json"
"schemas/process_view.schema.json" = "cute_evals/schemas/process_view.schema.json"
"schemas/multi_agent_trace.schema.json" = "cute_evals/schemas/multi_agent_trace.schema.json"
"schemas/judge_benchmark.schema.json" = "cute_evals/schemas/judge_benchmark.schema.json"
"schemas/trajectory_quality.schema.json" = "cute_evals/schemas/trajectory_quality.schema.json"
"schemas/agent_benchmark.schema.json" = "cute_evals/schemas/agent_benchmark.schema.json"
"schemas/compare-case.schema.json" = "cute_evals/schemas/compare-case.schema.json"
"schemas/compare-trace.schema.json" = "cute_evals/schemas/compare-trace.schema.json"
"schemas/compare-report.schema.json" = "cute_evals/schemas/compare-report.schema.json"
"schemas/judge-verdict.schema.json" = "cute_evals/schemas/judge-verdict.schema.json"
"schemas/semantic-judge-report.schema.json" = "cute_evals/schemas/semantic-judge-report.schema.json"
"schemas/task-review.schema.json" = "cute_evals/schemas/task-review.schema.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/cute_evals/benchmarks/gaia/official_scorer.py" = ["B006", "F401"]
