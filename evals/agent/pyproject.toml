[project]
name = "cute-evals"
version = "0.1.0"
description = "Execution-ledger evaluation sidecar for Cute-agent"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
frameworks = [
    "inspect-ai>=0.3,<1",
    "deepeval>=2,<4",
    "agentevals>=0.0.4,<1",
    "ragas>=0.2,<1",
    # ragas 0.4 imports a module removed in langchain-community 0.4.
    "langchain-community>=0.3.31,<0.4",
]
phase3 = [
    "datasets>=3,<5",
    "huggingface-hub>=0.24,<2",
]
phase4 = [
    "func-timeout>=4.3.5,<5",
    "pandas>=2.2,<4",
    "psycopg2-binary>=2.9,<3",
    "pymysql>=1.1,<2",
]

[project.scripts]
cute-evals = "cute_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cute_evals"]

[tool.hatch.build.targets.wheel.force-include]
"src/cute_evals/benchmarks/bird/manifest.yaml" = "cute_evals/benchmarks/bird/manifest.yaml"
"src/cute_evals/benchmarks/gaia/manifest.yaml" = "cute_evals/benchmarks/gaia/manifest.yaml"
"src/cute_evals/benchmarks/gaia/official_scorer.py" = "cute_evals/benchmarks/gaia/official_scorer.py"
"src/cute_evals/benchmarks/skillsbench/manifest.yaml" = "cute_evals/benchmarks/skillsbench/manifest.yaml"
"src/cute_evals/benchmarks/spider2/manifest.yaml" = "cute_evals/benchmarks/spider2/manifest.yaml"
"src/cute_evals/benchmarks/tau2/manifest.yaml" = "cute_evals/benchmarks/tau2/manifest.yaml"
"src/cute_evals/benchmarks/tau2/server.py" = "cute_evals/benchmarks/tau2/server.py"
"schemas/experiment.schema.json" = "cute_evals/schemas/experiment.schema.json"
"schemas/cell.schema.json" = "cute_evals/schemas/cell.schema.json"
"schemas/ab-report.schema.json" = "cute_evals/schemas/ab-report.schema.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"src/cute_evals/benchmarks/gaia/official_scorer.py" = ["B006", "F401"]
