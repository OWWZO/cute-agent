# Nightly / Release 评测专用 profile。
# 只允许连接显式指定的评测库，禁止复用 dev/prod 数据库。
server:
  port: 0

spring:
  datasource:
    mysql:
      username: ${CUTE_EVAL_DB_USER:root}
      password: ${CUTE_EVAL_DB_PASSWORD:}
      url: ${CUTE_EVAL_DB_URL:jdbc:mysql://127.0.0.1:3306/ai-agent-eval?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        minimum-idle: 1
        idle-timeout: 60000
        maximum-pool-size: 4
        max-lifetime: 600000
        connection-timeout: 10000

llm:
  default:
    # 评测固定使用确定性采样；重复运行只衡量系统稳定性，不混入温度随机性。
    temperature: 0.0

cute:
  file-artifact:
    local-file-mode: register
    # WorkBuddy 预检和评测入口会显式传入本次评测根目录；不允许回退到用户主目录或盘符根。
    allowed-root: "${CUTE_FILE_ARTIFACT_ALLOWED_ROOT:}"
  opencli:
    enabled: false
  host-cli:
    enabled: false
  code-mode:
    enabled: false
  browser-relay:
    enabled: false
  agent-browser:
    enabled: false

memory:
  ltm:
    enabled: false

autobots:
  agent:
    subagent-isolated-session: false
    background:
      auto-continuation: false
    channel:
      terminal-push: false
  autoagent:
    # eval 专用 cute-tool 地址：默认指向本机评测服务，允许通过环境变量替换。
    # 不复用 dev/prod 的私有配置，避免评测误连开发环境。
    code_interpreter_url: "${AUTOBOTS_AUTOAGENT_CODE_INTERPRETER_URL:http://127.0.0.1:1601}"
    # WorkBuddy Code 题目信息都在本地工作区；Web 工具只会制造 502/timeout/未配置噪音。
    tool_list: '{"default":"search,code_execution,docgen,docread,dataprep,canvas,image_generation,data_analysis,openui"}'
    skill:
      enabled: false
    web_search:
      mode: disabled

logging:
  level:
    root: info
    org.wwz.ai: info
  config: classpath:logback-spring.xml
