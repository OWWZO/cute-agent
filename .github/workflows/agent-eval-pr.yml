name: agent-eval-pr

on:
  pull_request:
    paths:
      - "evals/agent/**"
      - "Cute-agent-*/**"
      - "pom.xml"
      - ".github/workflows/agent-eval-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-eval-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cute-agent-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Install evaluation dependencies
        working-directory: evals/agent
        run: uv sync --frozen --extra dev --extra frameworks

      - name: Run scorer unit tests
        working-directory: evals/agent
        run: uv run pytest

      - name: Run A/B contract smoke
        working-directory: evals/agent
        run: >-
          uv run cute-evals ab run
          --experiment experiments/pr-contract-ab.yaml
          --out .eval-runs/ab-pr

      - name: Run trace export and replay tests
        run: >-
          mvn -pl Cute-agent-app -am test
          -DskipTests=false -Dskip.tests=false
          -Dtest=EvalTraceSanitizerTest,EvalTraceExportCliTest,ExecutionLedgerQueryServiceTimeRangeTest,EvalFixtureRunnerCliTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run Agent PR gate
        working-directory: evals/agent
        run: uv run cute-evals run --profile pr --suite all --out .eval-runs/pr

      - name: Run local skill simulation
        working-directory: evals/agent
        run: >-
          uv run cute-evals run
          --profile pr
          --suite skill-sim
          --out .eval-runs/skill-sim
          --skip-build

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cute-agent-eval-pr
          path: |
            evals/agent/.eval-runs/pr/report.json
            evals/agent/.eval-runs/pr/report.html
            evals/agent/.eval-runs/pr/attempts
            evals/agent/.eval-runs/ab-pr/report.json
            evals/agent/.eval-runs/ab-pr/report.html
            evals/agent/.eval-runs/ab-pr/audit.md
            evals/agent/.eval-runs/skill-sim/report.json
            evals/agent/.eval-runs/skill-sim/report.html
            evals/agent/.eval-runs/skill-sim/attempts
          if-no-files-found: warn

  judge-gate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Install evaluation dependencies
        working-directory: evals/agent
        run: uv sync --frozen --extra dev --extra frameworks

      - name: Run trusted judge gate
        working-directory: evals/agent
        env:
          CUTE_EVAL_JUDGE_MODEL: ${{ vars.CUTE_EVAL_JUDGE_MODEL }}
          CUTE_EVAL_JUDGE_BASE_URL: ${{ vars.CUTE_EVAL_JUDGE_BASE_URL }}
          CUTE_EVAL_JUDGE_API_KEY: ${{ secrets.CUTE_EVAL_JUDGE_API_KEY }}
        run: |
          if [ -z "$CUTE_EVAL_JUDGE_MODEL" ] || [ -z "$CUTE_EVAL_JUDGE_BASE_URL" ] || [ -z "$CUTE_EVAL_JUDGE_API_KEY" ]; then
            echo "judge gate requires CUTE_EVAL_JUDGE_MODEL, CUTE_EVAL_JUDGE_BASE_URL and CUTE_EVAL_JUDGE_API_KEY" >&2
            exit 1
          fi
          uv run cute-evals run --profile pr --suite all --out .eval-runs/judge --require-judge

      - name: Upload judge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cute-agent-eval-judge
          path: |
            evals/agent/.eval-runs/judge/report.json
            evals/agent/.eval-runs/judge/report.html
            evals/agent/.eval-runs/judge/attempts
          if-no-files-found: warn
